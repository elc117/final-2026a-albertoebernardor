services:
  - type: web
    name: divideai
    runtime: java
    buildCommand: cd divideai && mvn clean package -DskipTests
    startCommand: java -jar divideai/target/divideai-1.0-SNAPSHOT.jar
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
